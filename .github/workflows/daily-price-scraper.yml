name: Daily steel price scraper

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-steel-price-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape and validate
        run: python scraper.py
      - name: Commit changes if prices changed
        run: |
          if git diff --quiet -- godxf.json price_scraper_report.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add godxf.json price_scraper_report.json
          git commit -m "Update steel sheet prices"
          git push
